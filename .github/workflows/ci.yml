name: Sanger Trace Trimmer CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and QA tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,trace]" ruff
          python -m pip check
      - name: Compile modules
        run: python -m compileall -q agents cli.py sanger_trim.py trace_quality.py enrichment.py simulator.py
      - name: Lint trimming implementation and regression tests
        run: ruff check trace_quality.py tests/test_trace_quality.py
      - name: Validate browser code
        run: |
          node --check web/app.js
          node --test web/app.test.cjs
      - name: Test
        run: python -m pytest -q
      - name: Verify signed audit trail
        run: |
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
