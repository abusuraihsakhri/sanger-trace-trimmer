version: '3.8'

services:
  sanger-trace-trimmer:
    build: .
    container_name: sanger-trace-trimmer
    ports:
      - "8000:8000"
    environment:
      # IMPORTANT: Override this in production with a secure random value.
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a random AUDIT_SECRET_KEY before startup}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
